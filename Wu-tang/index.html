<!DOCTYPE html>
<html lang="en">
	<head>
    	<meta charset="utf-8">
    	<meta name="description" content="This is where your description goes">
    	<meta name="keywords" content="one, two, three">

		<title>Boondocks</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

		<main class="card">
		<h1>The Boondocks</h1>
		<h2>Your Name is...</h2>

			<div class="question">
				<span class="label">What is your favorite color?</span>
				<div class="options">
					<label class="option"><input class="choices" type="radio" name="name1" value="a"><span>Red</span></label>
					<label class="option"><input class="choices" type="radio" name="name1" value="b"><span>Orange</span></label>
					<label class="option"><input class="choices" type="radio" name="name1" value="c"><span>Yellow</span></label>
					<label class="option"><input class="choices" type="radio" name="name1" value="d"><span>Blue</span></label>
					<label class="option"><input class="choices" type="radio" name="name1" value="e"><span>Pink</span></label>
				</div>
			</div>
			<div class="question">
				<span class="label">What is your favorite meal of the day?</span>
				<div class="options">
					<label class="option"><input class="choices" type="radio" name="name2" value="a"><span>Breakfast</span></label>
					<label class="option"><input class="choices" type="radio" name="name2" value="b"><span>Lunch</span></label>
					<label class="option"><input class="choices" type="radio" name="name2" value="c"><span>Dinner</span></label>
					<label class="option"><input class="choices" type="radio" name="name2" value="d"><span>Dessert</span></label>
					<label class="option"><input class="choices" type="radio" name="name2" value="e"><span>Snack</span></label>
				</div>
			</div>
			<div class="question">
				<span class="label">What is your favorite movie genre?</span>
				<div class="options">
					<label class="option"><input class="choices" type="radio" name="name3" value="a"><span>Romance</span></label>
					<label class="option"><input class="choices" type="radio" name="name3" value="b"><span>Comedy</span></label>
					<label class="option"><input class="choices" type="radio" name="name3" value="c"><span>Action</span></label>
					<label class="option"><input class="choices" type="radio" name="name3" value="d"><span>Thriller</span></label>
					<label class="option"><input class="choices" type="radio" name="name3" value="e"><span>Drama</span></label>
				</div>
			</div>
			<div class="question">
				<span class="label">What is your favorite food?</span>
				<div class="options">
					<label class="option"><input class="choices" type="radio" name="name4" value="a"><span>Sushi</span></label>
					<label class="option"><input class="choices" type="radio" name="name4" value="b"><span>Pizza</span></label>
					<label class="option"><input class="choices" type="radio" name="name4" value="c"><span>Burgers</span></label>
					<label class="option"><input class="choices" type="radio" name="name4" value="d"><span>Chicken Nugs</span></label>
					<label class="option"><input class="choices" type="radio" name="name4" value="e"><span>Salad</span></label>
				</div>
			</div>
			<div class="question">
				<span class="label">What is your favorite drink</span>
				<div class="options">
					<label class="option"><input class="choices" type="radio" name="name5" value="a"><span>Water</span></label>
					<label class="option"><input class="choices" type="radio" name="name5" value="b"><span>Juice</span></label>
					<label class="option"><input class="choices" type="radio" name="name5" value="c"><span>Milk</span></label>
					<label class="option"><input class="choices" type="radio" name="name5" value="d"><span>Lemonade</span></label>
					<label class="option"><input class="choices" type="radio" name="name5" value="e"><span>Soda</span></label>
				</div>
			</div>

		<button class="send">Your Name is...</button>
	
		<h3 id="message"></h3>
	
		<h3 id="result"></h3>
		</main>
	
		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
